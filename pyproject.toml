[project]
name = "solo-runtime"
version = "1.0.0"
description = "Isolated uv task launcher for Solo research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
solo-manage = "solo_runtime.manage:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "solo_runtime"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
